<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

    <title>Result</title>

    <link
        rel="stylesheet"
        href="css/style.css?v=2"
    >

</head>

<body>

<nav class="navbar" id="mainNav">

    <img src="assets/logo.svg" alt="Trivio" class="navbar-logo">

    <button class="menu-toggle"
        onclick="document.getElementById('mainNav').classList.toggle('menu-open')"
        aria-label="Toggle menu">

        ☰

    </button>

    <div>

        <a href="dashboard.html" data-i18n="nav.dashboard">
            Dashboard
        </a>

        <a href="history.html" data-i18n="nav.myResults">
            My Results
        </a>

        <a href="leaderboard.html" data-i18n="nav.leaderboard">
            Leaderboard
        </a>

        <select id="langSwitcher" class="lang-switcher">
            <option value="en">English</option>
            <option value="ml">മലയാളം</option>
        </select>

    </div>

</nav>

<div class="container">

    <div class="card result-card">

        <h1 data-i18n="result.heading">
            🎉 Exam Completed
        </h1>

        <p class="welcome" data-i18n="result.subtitle">
            Your assessment has been submitted successfully.
        </p>

        <div class="result-box">

            <h2 data-i18n="result.score">
                Score
            </h2>

            <h1 id="score">
                0
            </h1>

        </div>

        <div class="result-box">

            <h2 data-i18n="result.percentage">
                Percentage
            </h2>

            <h1 id="percentage">
                0%
            </h1>

        </div>

        <div id="performance"></div>

        <!-- AI Explanation Section -->

        <div
            id="aiSection"
            style="display:none; margin-top:30px; text-align:left;">

            <h2 data-i18n="result.aiExplanationHeading">
                🤖 AI Explanation
            </h2>

            <div id="aiContent"></div>

        </div>

        <div class="action-buttons">

            <button onclick="goLeaderboard()" data-i18n="result.leaderboardBtn">
                🏆 Leaderboard
            </button>

            <button onclick="goHistory()" data-i18n="result.myResultsBtn">
                📊 My Results
            </button>

            <button onclick="goDashboard()" data-i18n="result.dashboardBtn">
                📚 Dashboard
            </button>

        </div>

    </div>

</div>

<script src="assets/i18n.js"></script>
<script src="js/result.js"></script>

</body>
</html>
