<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leaderboard</title>

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

    <link
        rel="stylesheet"
        href="css/style.css?v=2"
    >

</head>

<body>

    <nav class="navbar" id="mainNav">

        <img src="assets/logo.svg" alt="Trivio" class="navbar-logo">

        <button class="menu-toggle" onclick="document.getElementById('mainNav').classList.toggle('menu-open')" aria-label="Toggle menu">☰</button>

        <div>

            <a href="dashboard.html" data-i18n="nav.dashboard">
                Dashboard
            </a>

            <a href="history.html" data-i18n="nav.myResults">
                My Results
            </a>

            <a href="profile.html" data-i18n="nav.profile">
                Profile
            </a>

            <select id="langSwitcher" class="lang-switcher">
                <option value="en">English</option>
                <option value="ml">മലയാളം</option>
            </select>

        </div>

    </nav>

    <div class="container">

        <h1 data-i18n="leaderboard.heading">
            🏆 Leaderboard
        </h1>

        <p class="welcome" data-i18n="leaderboard.subtitle">
            Top performers for this exam.......
        </p>

        <div class="card">

            <div class="table-container table-cards">

                <table class="leaderboard-table">

                    <thead>

                        <tr>

                            <th data-i18n="leaderboard.colRank">
                                Rank
                            </th>

                            <th data-i18n="leaderboard.colName">
                                Name
                            </th>

                            <th data-i18n="leaderboard.colEmail">
                                Email
                            </th>

                            <th data-i18n="leaderboard.colScore">
                                Score
                            </th>

                            <th data-i18n="leaderboard.colPercentage">
                                Percentage
                            </th>

                        </tr>

                    </thead>

                    <tbody id="leaderboard">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <script src="assets/i18n.js"></script>
    <script src="js/leaderboard.js"></script>

</body>

</html>
