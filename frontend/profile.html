<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <title>My Profile</title>

    <link rel="stylesheet" href="css/style.css?v=2">
</head>

<body>

    <nav class="navbar" id="mainNav">

        <img src="assets/logo.svg" alt="Trivio" class="navbar-logo">

        <button class="menu-toggle" onclick="document.getElementById('mainNav').classList.toggle('menu-open')" aria-label="Toggle menu">☰</button>

        <div>

            <a href="dashboard.html" data-i18n="nav.dashboard">
                Dashboard
            </a>

            <a href="dashboard.html#multiplayer">🎮 Multiplayer</a>

            <a href="history.html" data-i18n="nav.history">
                History
            </a>

            <a href="leaderboard.html" data-i18n="nav.leaderboard">
                Leaderboard
            </a>

            <select id="langSwitcher" class="lang-switcher">
                <option value="en">English</option>
                <option value="ml">മലയാളം</option>
            </select>

            <a href="#" onclick="logout()" data-i18n="nav.logout">
                Logout
            </a>

        </div>

    </nav>

    <div class="container">

        <div class="card profile-card">

            <div class="profile-header">

                <div class="profile-avatar">
                    👤
                </div>

                <h1 data-i18n="profile.heading">
                    My Profile
                </h1>

                <p id="email">
                    Loading...
                </p>

            </div>

            <div class="profile-info">

                <div class="stat-card">

                    <h2 id="name">
                        -
                    </h2>

                    <p data-i18n="profile.name">
                        Name
                    </p>

                </div>

                <div class="stat-card">

                    <h2 id="attempts">
                        0
                    </h2>

                    <p data-i18n="profile.attempts">
                        Exams Attempted
                    </p>

                </div>

                <div class="stat-card">

                    <h2 id="highestScore">
                        0
                    </h2>

                    <p data-i18n="profile.highestScore">
                        Highest Score
                    </p>

                </div>

                <div class="stat-card">

                    <h2 id="avgScore">
                        0%
                    </h2>

                    <p data-i18n="profile.avgScore">
                        Average Score
                    </p>

                </div>

            </div>

            <div class="action-buttons">

                <a href="history.html">
                    <button class="btn-primary" data-i18n="profile.examHistory">
                        📊 Exam History
                    </button>
                </a>

                <a href="leaderboard.html">
                    <button class="btn-success" data-i18n="profile.leaderboardBtn">
                        🏆 Leaderboard
                    </button>
                </a>

                <a href="dashboard.html">
                    <button data-i18n="profile.takeExam">
                        📝 Take Exam
                    </button>
                </a>

            </div>

        </div>

    </div>

    <script src="assets/i18n.js"></script>
    <script src="js/profile.js"></script>

    <script>

        function logout(){

            localStorage.clear();

            window.location =
            "login.html";

        }

    </script>

</body>
</html>
