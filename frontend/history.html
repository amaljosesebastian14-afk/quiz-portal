<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Exam History</title>

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

    <link
        rel="stylesheet"
        href="css/style.css?v=2"
    >

</head>

<body>

    <nav class="navbar" id="mainNav">

        <img src="assets/logo.svg" alt="Trivio" class="navbar-logo">

        <button class="menu-toggle" onclick="document.getElementById('mainNav').classList.toggle('menu-open')" aria-label="Toggle menu">☰</button>

        <div>

            <a href="dashboard.html" data-i18n="nav.dashboard">
                Dashboard
            </a>

            <a href="dashboard.html#multiplayer">🎮 Multiplayer</a>

            <a href="profile.html" data-i18n="nav.profile">
                Profile
            </a>

            <select id="langSwitcher" class="lang-switcher">
                <option value="en">English</option>
                <option value="ml">മലയാളം</option>
            </select>

            <a href="#" onclick="logout()" data-i18n="nav.logout">
                Logout
            </a>

        </div>

    </nav>

    <div class="container">

        <h1 data-i18n="history.heading">📊 My Exam History</h1>

        <p class="welcome" data-i18n="history.subtitle">
            View all your exam attempts and scores.
        </p>

        <div class="card">

            <div class="table-container table-cards">

                <table class="history-table">

                    <thead>

                        <tr>

                            <th data-i18n="history.colExam">
                                Exam Name
                            </th>

                            <th data-i18n="history.colScore">
                                Score
                            </th>

                            <th data-i18n="history.colPercentage">
                                Percentage
                            </th>

                            <th data-i18n="history.colDate">
                                Date
                            </th>

                        </tr>

                    </thead>

                    <tbody id="historyTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <script src="assets/i18n.js"></script>
    <script src="js/history.js"></script>

    <script>

        function logout(){

            localStorage.clear();

            window.location =
            "login.html";
        }

    </script>

</body>
</html>
